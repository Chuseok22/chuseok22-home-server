<div id="restaurants-content" data-page-transition>
  <div class="flex gap-2 flex-wrap mb-2">
    <a
      href="{% url 'site:restaurants' %}"
      hx-get="{% url 'site:restaurants' %}"
      hx-target="#restaurants-content"
      hx-swap="outerHTML"
      hx-push-url="true"
      class="btn btn-sm {% if not has_any_filter %}btn-primary{% else %}btn-ghost{% endif %}"
    >전체</a>
    {% for item in meal_time_filters %}
    <a
      href="{% url 'site:restaurants' %}?{{ item.query }}"
      hx-get="{% url 'site:restaurants' %}?{{ item.query }}"
      hx-target="#restaurants-content"
      hx-swap="outerHTML"
      hx-push-url="true"
      class="btn btn-sm {% if item.is_selected %}btn-primary{% else %}btn-ghost{% endif %}"
    >{{ item.label }}</a>
    {% endfor %}
  </div>
  <div class="flex gap-2 flex-wrap mb-4">
    {% for item in tag_filters %}
    <a
      href="{% url 'site:restaurants' %}?{{ item.query }}"
      hx-get="{% url 'site:restaurants' %}?{{ item.query }}"
      hx-target="#restaurants-content"
      hx-swap="outerHTML"
      hx-push-url="true"
      class="badge-tag {% if item.is_selected %}badge-primary{% endif %}"
    >{{ item.tag.name }}</a>
    {% endfor %}
  </div>

  <div id="restaurant-map" class="w-full h-96 rounded-box mb-6"></div>
  <script>
    (function () {
      if (typeof kakao === 'undefined') { return; }
      kakao.maps.load(function () {
        const map = new kakao.maps.Map(document.getElementById('restaurant-map'), {
          center: new kakao.maps.LatLng(37.5665, 126.9780),
          level: 7,
        });
        const positions = [
          {% for restaurant in restaurants %}
          {
            lat: {{ restaurant.latitude }},
            lng: {{ restaurant.longitude }},
            url: '{% url "site:restaurant-detail" restaurant.pk %}',
          },
          {% endfor %}
        ];
        positions.forEach(function (pos) {
          const marker = new kakao.maps.Marker({
            position: new kakao.maps.LatLng(pos.lat, pos.lng),
            map: map,
          });
          kakao.maps.event.addListener(marker, 'click', function () {
            window.location.href = pos.url;
          });
        });
      });
    })();
  </script>

  <div class="grid gap-4 md:grid-cols-2">
    {% for restaurant in restaurants %}
    {% include 'site/partials/restaurant_card.html' %}
    {% empty %}
    <p class="opacity-60">등록된 맛집이 없습니다.</p>
    {% endfor %}
  </div>
</div>
