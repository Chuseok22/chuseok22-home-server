<svg class="visitor-sparkline" viewBox="0 0 {{ width }} {{ height }}" role="img" aria-label="{{ label }}">
  <polygon class="visitor-sparkline-area" points="{{ area_points }}"></polygon>
  <polyline class="visitor-sparkline-line" points="{{ line_points }}"></polyline>
  <circle class="visitor-sparkline-halo" cx="{{ dot_x }}" cy="{{ dot_y }}" r="7"></circle>
  <circle class="visitor-sparkline-dot" cx="{{ dot_x }}" cy="{{ dot_y }}" r="3.5"></circle>
</svg>
